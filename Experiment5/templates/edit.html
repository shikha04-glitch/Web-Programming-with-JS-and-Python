{% extends 'base.html' %}

{% block content %}

<div class="form-box">
<h2>Edit Post</h2>

<form method="POST">
    <input type="text" name="title" value="{{ post.title }}" required>
    <textarea name="content" required>{{ post.content }}</textarea>
    <button type="submit">Update</button>
</form>

</div>

{% endblock %}
