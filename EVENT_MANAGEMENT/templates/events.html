{% extends 'base.html' %}
{% block content %}

<h2>Events</h2>

<input type="text" id="search" placeholder="Search events...">

<div class="grid">
{% for e in events %}
<div class="card">
    <h3>{{ e.name }}</h3>
    <p>{{ e.date }}</p>
    <p>{{ e.venue }}</p>
    <p>RSVP: {{ e.rsvp }}</p>
</div>
{% endfor %}
</div>

{% endblock %}
