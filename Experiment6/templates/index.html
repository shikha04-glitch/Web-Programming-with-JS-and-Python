{% extends 'base.html' %}

{% block content %}

<a href="/add" class="btn">➕ Add Contact</a>

<form method="GET">
    <input type="text" name="search" placeholder="Search by name or phone">
</form>

<table>
    <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    {% for c in contacts %}
    <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.email }}</td>
        <td>
            <a href="/edit/{{ c.id }}" class="btn btn-edit">Edit</a>
            <a href="/delete/{{ c.id }}" class="btn btn-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
